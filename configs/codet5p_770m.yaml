# CodeT5+ 770M — pure encoder-decoder (standard T5 arch), FULL fine-tuning.
# Clean fallback / fast smoke for the seq2seq pipeline (no custom modeling code).
# Plenty of headroom on A100 80GB, so the batch is larger.
model_name_or_path: Salesforce/codet5p-770m
output_dir: runs/codet5p_770m
trust_remote_code: false

seq2seq:
  max_source_length: 512    # encoder cap (CodeT5+ architectural max); Qwen sees 1024
  max_target_length: 512    # decoder: covers the longest type targets the filter keeps

training:
  per_device_train_batch_size: 4     # batch 16 OOMs full-FT on the 40GB MIG slice (T5 CE upcasts lm_logits to fp32)
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4     # effective batch 16 (matches the Qwen run and the 2b config)
  num_train_epochs: 1.2                # full-FT T5 needs more than Qwen's 1.5; best-checkpoint on eval_loss picks each model's optimum
  learning_rate: 0.0001              # 1e-4: full-FT of this small T5 is stable and strong here; tuned for CodeT5+'s own best (Qwen LoRA uses 2e-4)
  lr_scheduler_type: cosine
  warmup_ratio: 0.1                  # matched to the Qwen run
  weight_decay: 0.01
  bf16: true
  optim: paged_adamw_8bit            # matched to the Qwen run (8-bit Adam state; near-lossless for FT)
  seed: 42
  eval_steps: 25                     # == save_steps so every eval is a best-checkpoint candidate; coarser than Qwen (longer ~740-step run)
  save_steps: 25                     # ~30 evals (was 10/10: eval was 78% of wall-clock)
  save_total_limit: 3
  logging_steps: 5
  report_to: none
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
