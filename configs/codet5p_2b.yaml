# CodeT5+ 2B — encoder-decoder (seq2seq), FULL fine-tuning.
# Largest CodeT5+ that fully fine-tunes on a single A100 80GB:
#   fp32 params + grads + AdamW(m,v) ~= 16 bytes/param ~= 32 GB, leaving
#   ~48 GB for activations / batch. (6B/16B would need ZeRO/offload.)
# codet5p-2b ships custom modeling code -> trust_remote_code: true.
model_name_or_path: Salesforce/codet5p-2b
output_dir: runs/codet5p_2b
trust_remote_code: true

seq2seq:
  max_source_length: 512    # encoder cap (CodeT5+ architectural max); Qwen sees 1024
  max_target_length: 512    # decoder: covers the longest type targets the filter keeps

training:
  per_device_train_batch_size: 4     # 8 OOMs at full FT; 4 halves activations
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4     # effective batch 16 (matches the Qwen run)
  num_train_epochs: 3                # full-FT T5 needs more than Qwen's 1.5; best-checkpoint on eval_loss picks each model's optimum
  learning_rate: 0.00005             # 5e-5: standard for full FT of T5-family (method-appropriate)
  lr_scheduler_type: cosine
  warmup_ratio: 0.1                  # matched to the Qwen run
  weight_decay: 0.01
  bf16: true                         # mixed-precision autocast; params stay fp32
  optim: paged_adamw_8bit            # matched to the Qwen run (8-bit Adam state)
  gradient_checkpointing: false      # set true to trade compute for memory if still tight
  seed: 42
  eval_steps: 10                     # matched to the Qwen run
  save_steps: 10
  save_total_limit: 3
  logging_steps: 5
  report_to: none
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
