# Qwen2.5-Coder-7B, QLoRA -- TYPESPEC track (target: the original @spec).
#
# Starts from configs/qwen7b_qlora.yaml unchanged, so a difference in results
# between the two tracks is a difference in the target, not in the regime. Tune
# from here if this track's own optimum turns out to be elsewhere: the goal is
# the best inference of each target, not a matched-hyperparameter comparison.
#
# The one value worth revisiting first is eval_steps/save_steps. Specs are much
# shorter than Descr annotations, so a step covers more examples under packing
# and the run is shorter; 10 may be finer than it needs to be.
model_name_or_path: Qwen/Qwen2.5-Coder-7B
output_dir: runs/qwen7b_typespec

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8     # effective batch 16
  num_train_epochs: 1.2
  learning_rate: 0.0001              # as on the Descr track (2e-4 was worse there)
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  bf16: true
  optim: paged_adamw_8bit
  packing: true
  max_seq_length: 1024
  seed: 42
  eval_steps: 10                     # == save_steps so every eval is a best-checkpoint candidate
  save_steps: 10
  save_total_limit: 3                # the best checkpoint is protected by load_best_model_at_end
  logging_steps: 1
  report_to: none
  load_best_model_at_end: True
  metric_for_best_model: "eval_loss"
