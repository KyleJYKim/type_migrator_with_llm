# CodeT5+ 770M, full fine-tuning -- TYPESPEC track (target: the original @spec).
#
# Starts from configs/codet5p_770m.yaml unchanged, so a difference in results
# between the two tracks is a difference in the target, not in the regime. Tune
# from here if this track's own optimum turns out to be elsewhere.
model_name_or_path: Salesforce/codet5p-770m
output_dir: runs/codet5p_770m_typespec
trust_remote_code: false

seq2seq:
  # 1536, not 512. At 512 the encoder silently truncated the tail of ~3-5% of
  # prompts (and, before the prompt reorder, could cut away the definition and
  # the `### Output:` marker entirely). The longest prompt in the corpus is
  # ~1,320 tokens, so nothing truncates here. T5's relative position embeddings
  # impose no architectural 512 limit. generate_seq2seq*.py must be run with the
  # SAME --max_source_length, and reports a count if anything still truncates.
  max_source_length: 1536
  # Attention memory grows with the square of the sequence length, so tripling
  # the cap needs the batch split and checkpointing on to fit; the effective
  # batch stays 16, matching the Qwen run.
  max_target_length: 512    # targets are far shorter: the filter keeps <1000 chars

training:
  per_device_train_batch_size: 2     # batch 16 OOMs full-FT on the 40GB MIG slice
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8     # effective batch 16, at half the per-device size
  num_train_epochs: 1.2
  learning_rate: 0.0001
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  bf16: true
  gradient_checkpointing: true   # trades compute for activation memory at the longer encoder length
  optim: paged_adamw_8bit
  seed: 42
  eval_steps: 25                     # == save_steps so every eval is a best-checkpoint candidate
  save_steps: 25
  save_total_limit: 3
  logging_steps: 5
  report_to: none
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
