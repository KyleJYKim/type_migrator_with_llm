# CodeT5+ 770M, full fine-tuning -- TYPESPEC track (target: the original @spec).
#
# Starts from configs/codet5p_770m.yaml unchanged, so a difference in results
# between the two tracks is a difference in the target, not in the regime. Tune
# from here if this track's own optimum turns out to be elsewhere.
model_name_or_path: Salesforce/codet5p-770m
output_dir: runs/codet5p_770m_typespec
trust_remote_code: false

seq2seq:
  max_source_length: 512    # encoder cap (CodeT5+ architectural max); Qwen sees 1024
  max_target_length: 512    # a spec is far shorter than a Descr type: ample headroom

training:
  per_device_train_batch_size: 4     # batch 16 OOMs full-FT on the 40GB MIG slice
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 4     # effective batch 16 (matches the Qwen run)
  num_train_epochs: 1.2
  learning_rate: 0.0001
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  bf16: true
  optim: paged_adamw_8bit
  seed: 42
  eval_steps: 25                     # == save_steps so every eval is a best-checkpoint candidate
  save_steps: 25
  save_total_limit: 3
  logging_steps: 5
  report_to: none
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
