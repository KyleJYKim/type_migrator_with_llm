model_name_or_path: Qwen/Qwen2.5-Coder-7B
output_dir: runs/qwen2.5_7b_qlora

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: bfloat16

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

training:
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 8
  num_train_epochs: 1.2
  learning_rate: 0.0001              # reverted from 2e-4 (2e-4 was worse: val 0.886 best/0.919 final vs 0.883/0.902; compat 37.1% vs 39.5%)
  lr_scheduler_type: cosine
  warmup_ratio: 0.1
  weight_decay: 0.01
  bf16: true
  optim: paged_adamw_8bit
  packing: true
  max_seq_length: 1024
  seed: 42
  eval_steps: 10                     # == save_steps so every eval is a best-checkpoint candidate
  save_steps: 10                     # ~17 evals over the ~175-step run (was 5/10: eval was 72% of wall-clock)
  save_total_limit: 3                # best checkpoint is protected by load_best_model_at_end even at a small limit
  logging_steps: 1
  report_to: none
  load_best_model_at_end: True
  metric_for_best_model: "eval_loss"